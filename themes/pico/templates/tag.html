{% extends "base.html" %}

{% block title %}Tag: {{ tag }} – {{ SITENAME }}{% endblock %}

{% block content %}
<h1>Tag: {{ tag }}</h1>
{% for article in articles %}
<article>
  <h3><a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></h3>
  <small>{{ article.date.strftime('%d %B %Y') }}</small>
</article>
{% endfor %}
{% endblock %}
