{% extends "base.html" %}

{% block title %}Archivo – {{ SITENAME }}{% endblock %}

{% block content %}
<h1>Archivo</h1>
{% for article in dates %}
<p><small>{{ article.date.strftime('%d/%m/%Y') }}</small> — <a href="{{ SITEURL }}/{{ article.url }}">{{ article.title }}</a></p>
{% endfor %}
{% endblock %}
